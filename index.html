let lang="en",category="All",showSaved=false,query="",saved=new Set();
try{saved=new Set(JSON.parse(localStorage.getItem("cc-saved")||"[]"))}catch(e){}
const $=id=>document.getElementById(id);
function notify(message){$("toast").textContent=message;$("toast").style.display="block";clearTimeout(notify.timer);notify.timer=setTimeout(()=>$("toast").style.display="none",2100)}
function persist(){try{localStorage.setItem("cc-saved",JSON.stringify([...saved]))}catch(e){}}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function categories(){
 const t=copy[lang];let cats=["All",...Object.keys(catNames)];
 $("categories").innerHTML=cats.map(c=>`<button class="chip ${category===c?"active":""}" data-cat="${c}">${c==="All"?t.all:catNames[c][lang]}</button>`).join("");
 $("categories").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.cat;showSaved=false;render()}));
}
function render(){
 const t=copy[lang];$("headline").textContent=t.headline;$("subhead").textContent=t.subhead;$("search").placeholder=t.search;$("catTitle").textContent=t.categories;$("listTitle").textContent=showSaved?t.savedTitle:t.list;$("hint").textContent=t.hint;$("savedLabel").textContent=t.saved;$("savedCount").textContent=saved.size;
 document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 categories();
 const idx={en:2,bn:3,hi:4}[lang], q=query.trim().toLocaleLowerCase();
 const filtered=data.filter(row=>(category==="All"||row[1]===category)&&(!showSaved||saved.has(row[0]))&&(!q||(row[idx]+" "+row[1]+" "+catNames[row[1]][lang]).toLocaleLowerCase().includes(q)));
 $("resultCount").textContent=filtered.length;
 $("cards").innerHTML=filtered.length?filtered.map(row=>`<article class="card"><div class="cardtop"><span class="tag">${catNames[row[1]][lang]}</span><button class="save" data-save="${row[0]}" aria-label="Save caption">${saved.has(row[0])?"♥":"♡"}</button></div><p class="quote">${esc(row[idx])}</p><div class="actions"><button data-copy="${row[0]}">${t.copy}</button><button class="primary" data-share="${row[0]}">${t.share}</button></div></article>`).join(""):`<div class="empty">${t.empty}</div>`;
 $("cards").querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>{let id=+b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);persist();render()}));
 $("cards").querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{let row=data.find(r=>r[0]===+b.dataset.copy);await copyText(row[idx]);notify(t.copied)}));
 $("cards").querySelectorAll("[data-share]").forEach(b=>b.addEventListener("click",async()=>{let row=data.find(r=>r[0]===+b.dataset.share);try{if(navigator.share){await navigator.share({text:row[idx]});}else{await copyText(row[idx]);notify(t.copied)}}catch(e){} }));
}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));
$("search").addEventListener("input",e=>{query=e.target.value;render()});
$("savedToggle").addEventListener("click",()=>{showSaved=!showSaved;render()});
render();
</script>
